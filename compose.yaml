name: smapass-web-demo

services:
  web:
    image: smapass-web:demo
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_ORIGIN: ${NEXT_PUBLIC_BACKEND_ORIGIN:?set public backend URL}
    restart: unless-stopped
    init: true
    environment:
      SITE_ORIGIN: ${SITE_ORIGIN:?set canonical HTTPS website URL}
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/about').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

